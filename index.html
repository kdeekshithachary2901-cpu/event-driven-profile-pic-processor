<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Upload Profile Picture</h2>
        <!-- This is the file selector button -->
        <input type="file" id="profilePicInput" accept="image/*" />
    </div>

    <!-- This links your HTML page directly to your upload code -->
  <!-- This script imports app.js so it runs and sets up your global window connection -->
<script type="module" src="./app.js?v=5"></script>

<script>
    // This standard script waits for the file selector to change, then calls the function safely
    document.getElementById('profilePicInput').addEventListener('change', (event) => {
        if (window.uploadProfilePicture) {
            window.uploadProfilePicture(event);
        } else {
            console.error("Upload function not loaded yet!");
        }
    });
</script>

</body>
</html>
