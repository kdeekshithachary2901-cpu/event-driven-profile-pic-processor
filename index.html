<!-- 1. Load the Supabase library using a direct, absolute production bundle link -->
<script src="https://jsdelivr.net"></script>

<script>
  // 2. Put your actual project keys inside these quotes
  const supabaseUrl = 'https://yrfjgzakunovdgcrhkzl.supabase.co'; 
  const supabaseAnonKey = 'sb_publishable_6_uBDWWPpuLHRvnJw-Gxxw_UulNEOB2';
  
  // 3. Initialize using the proper global reference window hook
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

  document.getElementById('profilePicInput').addEventListener('change', async (event) => {
    // 4. Extract the exact individual single file from the selector list
    const file = event.target.files[0];
    if (!file) return;

    console.log("File detected! Initiating storage transmission for:", file.name);

    const fileExtension = file.name.split('.').pop();
    const fileName = `user-${Date.now()}.${fileExtension}`;

    // 5. Send the file straight up to your cloud avatars bucket
    const { data, error } = await supabaseClient.storage
      .from('avatars')
      .upload(fileName, file, {
        cacheControl: '3600',
        upsert: false
      });

    if (error) {
      console.error('Upload failed details:', error.message);
    } else {
      console.log('Upload successful! File saved at:', data.path);
    }
  });
</script>
