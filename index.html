<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input[type="file"] { margin-top: 15px; display: block; margin-bottom: 15px; }
        button { background: #24b47e; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1c8c61; }
        #statusMessage { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Upload Profile Picture</h2>
        <!-- Standard HTML Form tracking elements -->
        <input type="file" id="profilePicInput" accept="image/*" />
        <button id="uploadBtn">Upload to Storage</button>
        <div id="statusMessage">Select a file and click upload</div>
    </div>

    <script>
        // 1. Replace these placeholders with your exact Supabase details!
        const supabaseUrl = 'https://yrfjgzakunovdgcrhkzl.supabase.co'; 
        const supabaseAnonKey = 'sb_publishable_6_uBDWWPpuLHRvnJw-Gxxw_UulNEOB2';

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('profilePicInput');
            const statusDiv = document.getElementById('statusMessage');
            
            const file = fileInput.files[0];
            if (!file) {
                statusDiv.innerText = "Error: Please select a file first!";
                return;
            }

            statusDiv.innerText = "Processing transmission...";
            console.log("Initiating direct HTTP upload for:", file.name);

            // Generate clean, unique file name
            const fileExtension = file.name.split('.').pop();
            const fileName = `user-${Date.now()}.${fileExtension}`;

            // 2. Construct the direct REST API endpoint URL path for Supabase Storage
            const uploadUrl = `${supabaseUrl}/storage/v1/object/avatars/${fileName}`;

            try {
                // 3. Execute a native browser fetch request bypassing external libraries entirely
                const response = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${supabaseAnonKey}`,
                        'apikey': supabaseAnonKey,
                        'Content-Type': file.type
                    },
                    body: file
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Storage upload rejected.');
                }

                console.log('Upload successful! Raw data:', result);
                statusDiv.style.color = "green";
                statusDiv.innerText = `Upload successful! Saved as: ${fileName}`;

            } catch (error) {
                console.error('Upload process failed:', error.message);
                statusDiv.style.color = "red";
                statusDiv.innerText = `Upload failed: ${error.message}`;
            }
        });
    </script>

</body>
</html>
