<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Upload Profile Picture</h2>
        <!-- This is the file selector button -->
        <input type="file" id="profilePicInput" accept="image/*" />
    </div>

    <!-- This links your HTML page directly to your upload code -->
<!-- 1. Load the Supabase library cleanly using a standard global script tag -->
<script src="https://jsdelivr.net"></script>

<script>
  // 2. Initialize your Supabase client directly inside the HTML page
  // Replace these placeholders with your actual copied strings from your Supabase settings!
  const supabaseUrl = 'https://yrfjgzakunovdgcrhkzl.supabase.co'; 
  const supabaseAnonKey = 'sb_publishable_6_uBDWWPpuLHRvnJw-Gxxw_UulNEOB2';
  
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

  // 3. Set up the file change listener
  document.getElementById('profilePicInput').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    console.log("Starting upload processing for file:", file.name);

    // Generate a clean, unique file name for the user profile
    const fileExtension = file.name.split('.').pop();
    const fileName = `user-${Date.now()}.${fileExtension}`;

    // 4. Send the file straight up to your 'avatars' storage bucket
    const { data, error } = await supabaseClient.storage
      .from('avatars')
      .upload(fileName, file, {
        cacheControl: '3600',
        upsert: false
      });

    if (error) {
      console.error('Upload failed:', error.message);
    } else {
      console.log('Upload successful! File saved at:', data.path);
    }
  });
</script>
        } else {
            console.error("Upload function not loaded yet!");
        }
    });
</script>

</body>
</html>
